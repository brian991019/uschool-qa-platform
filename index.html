
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USchool 問答平台</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>USchool</h1>
        <p class="subtitle">校園知識交流平台</p>

        <div class="tabs">
            <button id="loginTab" class="active">登入</button>
            <button id="registerTab">註冊</button>
        </div>

        <!-- 登入區域 -->
        <form id="loginForm">
            <h2>歡迎回來</h2>

            <input id="loginUsername"
                type="text"
                placeholder="使用者帳號"
                required>
            <!--required意味著這格是必填欄，然後input是不需要結尾的，直接使用>包起來就好了-->
            <br>
            <input id="loginPassword"
                type="password"
                placeholder="密碼"
                required>

            <button type="submit" class="submitBtn">登入</button>
        </form>

        <!-- 註冊區域 -->
        <form id="registerForm" class="hidden">
            <h2>建立帳號</h2>
            <div class="form-group">
                <label for="loginRole">登入身份</label>
<!-- 
                <select id="loginRole" required>
                    <option value="student">學生</option>
                    <option value="teacher">老師</option>
                    <option value="admin" disabled>⚠️管理員</option>
                </select>
            </div>
            <br> -->
            <input id="registerName"
                type="text"
                placeholder="姓名"
                required>
            <br>
            <input id="registerUsername"
                type="text"
                placeholder="使用者帳號"
                required>
            <br>
            <input id="registerEmail"
                type="email"
                placeholder="電子郵件"
                required>
            <br>
            <input id="registerPassword"
                type="password"
                placeholder="密碼"
                required>

            <button type="submit" class="submitBtn">註冊</button>
            <button type="button" id="teacherRegisterBtn" class="teacher-link">
                申請教師帳號
            </button>
            <p class = 'warning'>注意：由於我無法確保你的數據安全，請勿使用你常使用的賬密，建議直接以學號設置</p>
            <p class = 'warning'>另外管理員身份需申請，且目前暫不開放，未來教師身份需要由管理員確認申請才可正式建立賬號</p>
            <p class = 'warning'>本頁面針對學生，如果你是教師請點擊申請教師賬號按鈕！</p>
        </form>

        <p id="message"></p>
    </main>

    <script type="module" src="./script.js"></script>


</body>
</html>
