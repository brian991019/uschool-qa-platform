
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USchool 問答平台</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>USchool</h1>
        <p class="subtitle">校園知識交流平台</p>

        <div class="tabs">
            <button id="loginTab" class="active">登入</button>
            <button id="registerTab">註冊</button>
        </div>

        <!-- 登入區域 -->
        <form id="loginForm">
            <h2>歡迎回來</h2>

            <input id="loginUsername"
                type="text"
                placeholder="使用者帳號"
                required>

            <input id="loginPassword"
                type="password"
                placeholder="密碼"
                required>

            <button type="submit" class="submitBtn">登入</button>
        </form>

        <!-- 註冊區域 -->
        <form id="registerForm" class="hidden">
            <h2>建立帳號</h2>

            <input id="registerName"
                type="text"
                placeholder="姓名"
                required>

            <input id="registerUsername"
                type="text"
                placeholder="使用者帳號"
                required>

            <input id="registerEmail"
                type="email"
                placeholder="電子郵件"
                required>

            <input id="registerPassword"
                type="password"
                placeholder="密碼"
                required>

            <button type="submit" class="submitBtn">註冊</button>
        </form>

        <p id="message"></p>
    </main>

    <script type="module" src="./script.js"></script>

</body>
</html>
